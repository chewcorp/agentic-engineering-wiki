name: wiki

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install okf-core \
            --index-url https://chewcorp.github.io/okf-core/simple/ \
            --extra-index-url https://pypi.org/simple/
          pip install -r requirements-docs.txt
      - name: Validate bundle
        run: |
          okf validate --bundle agentic-engineering
          okf graph --bundle agentic-engineering --broken | python -c "import json,sys; b=json.load(sys.stdin)['broken_links']; print(f'{len(b)} broken links'); sys.exit(1 if b else 0)"
      - name: Check generated indexes are current
        run: |
          okf index --bundle agentic-engineering --recurse
          if [ -n "$(git status --porcelain -- wiki)" ]; then
            echo "Generated indexes are stale; run: okf index --bundle agentic-engineering --recurse"
            git status --porcelain -- wiki
            exit 1
          fi
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
